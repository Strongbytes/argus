[project]
name = "argus-trace"
version = "0.6.0"
description = "A thin wrapper over OpenInference + OpenTelemetry that captures LLM agent traces to disk and to a remote OTLP endpoint."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-sdk>=1.30",
    # The default on-disk sink writes canonical OTLP/JSON, so it needs the OTLP
    # protobuf span encoder (and, transitively, protobuf). This is the common
    # encoding layer only -- not a network transport -- so the core stays light;
    # the ``otlp`` extra below adds the actual OTLP/HTTP exporter on top.
    "opentelemetry-exporter-otlp-proto-common>=1.30",
    "python-dotenv>=1.0",
]

# The OpenInference instrumentors and the agent SDKs are optional: Argus only
# touches an instrumentor when its target library is installed, which keeps the
# core wrapper genuinely thin. Install the extra that matches your stack.
[project.optional-dependencies]
openai-agents = ["openinference-instrumentation-openai-agents"]
claude = ["openinference-instrumentation-claude-agent-sdk"]
agno = [
    "openinference-instrumentation-agno",
    "openinference-instrumentation-openai",
]
# Matches the curated ``openai`` key, for a script calling the OpenAI client
# directly rather than through an agent framework.
openai = ["openinference-instrumentation-openai"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]

# The tooling for working on Argus itself, kept in a PEP 735 dependency group
# rather than an extra: an extra is published in the distribution's metadata (so
# ``pip install argus-trace[dev]`` would become part of the package's contract),
# while a group is a local development concern only. Install it from a checkout
# with ``pip install -e . --group dev`` (pip 25.1+).
#
# Exact pins here, unlike the ranges above: this list configures one machine
# rather than every installation, and a formatter that drifts a minor version
# reformats files out from under the next contributor. The runtime dependencies
# stay loose because a library must coexist with whatever its host resolved.
[dependency-groups]
dev = [
    "black==25.1.0",
    "commitizen==4.16.4",
    "isort==6.0.1",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Version bumps are derived from Conventional Commit messages, not chosen by
# hand: run ``cz bump`` on demand and Commitizen scans the commits since the
# last ``v*`` tag, computes the next version, rewrites ``[project].version``,
# updates CHANGELOG.md, and creates the tag. ``major_version_zero`` keeps us on
# the pre-1.0 (0.x) semver track -- breaking changes bump the minor, features
# bump the patch -- until we deliberately cut 1.0.0 with ``cz bump 1.0.0``.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[tool.black]
line-length = 80
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 80
# The test suite is a package imported as ``tests.*``; classify it as local so
# its imports don't get grouped with third-party packages.
known_local_folder = ["tests"]

[tool.pytest.ini_options]
# Put the project root on sys.path so the ``tests`` package (and its shared
# helpers, imported as ``tests.factories``) resolves regardless of import mode.
pythonpath = ["."]
testpaths = ["tests"]
# Surface our re-init RuntimeWarning loudly in the suite, and let individual
# tests assert on it explicitly via pytest.warns / filterwarnings markers.
filterwarnings = ["always"]

# Coverage is opt-in (run ``pytest --cov``); the source and reporting defaults
# below mean that single flag is enough -- no need to repeat ``--cov=argus``.
[tool.coverage.run]
source = ["argus"]
branch = true

[tool.coverage.report]
show_missing = true
